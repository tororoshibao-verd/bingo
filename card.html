<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>マイカード｜Bonbon Bingo</title>
  <link rel="icon" type="image/svg+xml" href="images/heart.svg">
  <link rel="stylesheet" href="css/style.css">
  <!-- 数字のルール、保存と変更通知、参加者用の表示の順に読み込む。 -->
  <script defer src="js/game.js"></script>
  <script defer src="js/storage.js"></script>
  <script defer src="js/card.js"></script>
</head>
<!-- URLの発行情報を確認してから card.js が data-card-state を切り替える。 -->
<body class="card-page" data-card-state="loading">
  <!-- .card-shell は参加者の画面全体。PCではこの列を中央に保ち、左右に包装紙を表示する。 -->
  <div class="card-shell">
    <!-- 自分がどの状態のカードを見ているかを表示。card.js は body の状態を切り替え、該当するバッジを見せる。 -->
    <header class="site-header">
      <div class="header-inner">
        <img class="brand-logo" src="images/logo.svg" alt="Bonbon Bingo" width="157" height="34">
        <div class="card-state-badges">
          <span class="badge card-badge state-playing">ゲーム中</span>
          <span class="badge card-badge state-register">受付中</span>
          <span class="badge card-badge state-ended">終了</span>
          <span class="badge card-badge state-closed">受付終了</span>
          <span class="badge card-badge state-reset">リセット済み</span>
          <span class="badge card-badge state-error">エラー</span>
        </div>
      </div>
    </header>

    <main class="card-main">
      <noscript>カードの表示・参加登録にはJavaScriptを有効にしてください。</noscript>
      <!-- 登録済みカードの表示。#card-play はゲーム中と終了後に共用し、終了後も最後の盤面を確認できる。 -->
      <div id="card-play" class="card-view">
        <!-- 自分の当選が確定すると #card-result を開き、最初にそろった回を表示する。盤面も続けて確認できる。 -->
        <div role="status" aria-atomic="true">
          <p id="card-result" class="bingo-banner" hidden>
            <strong class="bingo-word number">BINGO</strong>
            <span id="card-result-round"></span>
          </p>
        </div>
        <!-- 最新の確定番号を示す。JSは保存された履歴の末尾から #card-letter・#card-number・#card-round を更新する。 -->
        <section class="latest-card-ball" aria-labelledby="latest-heading">
          <div>
            <h2 id="latest-heading">最新の番号</h2>
            <p id="card-round">抽選待ち</p>
          </div>
          <div class="latest-value" aria-live="polite" aria-atomic="true">
            <span id="card-letter" class="number" hidden></span>
            <strong id="card-number" class="number">―</strong>
          </div>
        </section>

        <!-- 自分のカード。登録済みの識別子と名前を #card-id と #card-name に書き戻す。長いIDも最後まで表示する。 -->
        <section class="player-ticket" aria-labelledby="card-title">
          <header class="ticket-owner">
            <div>
              <p id="card-id" class="card-serial"></p>
              <h1 id="card-title"><span id="card-name"></span>のカード</h1>
            </div>
            <img src="images/bow.svg" width="56" height="40" alt="">
          </header>

          <!-- #card-grid はB・I・N・G・O順の5×5表。保存した配置で tbody に5行を作る。
               .is-open と読み上げ用の「抽選済み」を履歴に合わせて更新する。中央 .free-cell は最初から開いたまま。 -->
          <div class="ticket-board">
            <table id="card-grid">
              <caption class="sr-only">自分のビンゴカード</caption>
              <thead>
                <tr><th scope="col">B</th><th scope="col">I</th><th scope="col">N</th><th scope="col">G</th><th scope="col">O</th></tr>
              </thead>
              <!-- card.js が保存済みの25マスを並べ、以降は抽選履歴に合わせて印を切り替える。 -->
              <tbody></tbody>
            </table>
            <p class="card-caption">出た番号のマスが自動で開きます</p>
          </div>
        </section>

        <!-- #card-sync は自分が反映した回を示す。終了時は #card-end に切り替える。 -->
        <p id="card-sync" class="card-sync state-playing" role="status"></p>
        <p id="card-end" class="card-sync state-ended">ゲームは終了しました</p>
      </div>

      <!-- 初回登録。#card-entry は開始前の発行済み・未登録カードだけに見せる。 -->
      <section id="card-entry" class="card-view" aria-labelledby="entry-heading">
        <!-- 発行されたカードの識別子。JSはURLと発行記録を照合して #entry-id と下の #fallback-id に同じIDを表示する。 -->
        <div class="entry-art">
          <div class="entry-ticket">
            <strong class="number" aria-hidden="true">B I N G O</strong>
            <span id="entry-id" class="card-serial"></span>
          </div>
          <img class="entry-bow" src="images/bow.svg" width="56" height="40" alt="">
          <img class="entry-candy" src="images/candy.svg" width="48" height="32" alt="">
        </div>
        <h1 id="entry-heading">カードの参加登録</h1>
        <p class="entry-intro">ゲーム開始前に登録を済ませてね。</p>

        <!-- #entry-name の内容が表示名。入力された文字数をJSで調べ、理由があれば #entry-feedback に表示する。 -->
        <form id="entry-form" class="entry-fields">
          <div class="entry-label">
            <label for="entry-name">表示名</label>
            <span id="entry-limit">任意・10文字まで</span>
          </div>
          <input id="entry-name" type="text" placeholder="例）ゆい" aria-describedby="entry-limit entry-hint entry-feedback">
          <p id="entry-hint" class="entry-hint">登録後の名前変更はできません。</p>
          <p id="entry-feedback" class="entry-feedback" role="alert" hidden></p>
          <!-- 名前があるときは #register-card で参加。空欄のときは #register-card-id を選ぶと表示名がカードIDになる。 -->
          <div class="entry-actions">
            <button id="register-card" class="button button-primary" type="submit" disabled>このカードで参加する</button>
            <button id="register-card-id" class="button button-secondary" type="button" disabled><span>IDで始める（<span id="fallback-id"></span>）</span></button>
          </div>
        </form>
      </section>

      <!-- 受付が締め切られた未登録カード。#card-closed に切り替え、入力・登録・報告を止める。 -->
      <section id="card-closed" class="card-view card-notice">
        <h1>参加受付は終了しました</h1>
        <p>このカードは今回のゲームに登録されていません。</p>
      </section>
      <!-- 旧ゲームのカード。#card-reset に切り替え、以前の数字・名前・当選結果が表示されないようにする。 -->
      <section id="card-reset" class="card-view card-notice">
        <h1>ゲームがリセットされました</h1>
        <p>参加するには、進行役に新しいカードを発行してもらってください。</p>
      </section>
      <!-- データを読み込めない場合。JSは #card-error-reason に保存失敗・無効なURLなどの理由を表示する。 -->
      <section id="card-error" class="card-view card-notice" aria-live="polite">
        <h1>カードを確認できません</h1>
        <p id="card-error-reason">カードの保存情報を読み込めませんでした。</p>
        <!-- 読み込みエラーからの再試行。発行済みURLを保ったまま最新の保存内容を読み直す。 -->
        <button id="retry-card" class="button" type="button">もう一度読み込む</button>
      </section>
    </main>
  </div>
</body>
</html>
